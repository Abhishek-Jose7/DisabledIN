<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <!-- Include Plotly JavaScript library -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .chart-container {
            margin: 20px 0;
        }
        .chart-container h2 {
            text-align: center;
        }
        #disability-graph, #job-field-graph {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>
    <h1>Analytics Dashboard</h1>

    <div class="chart-container">
        <h2>Disabilities Distribution</h2>
        <div id="disability-graph"></div>
    </div>

    <div class="chart-container">
        <h2>Job Field Interest Distribution</h2>
        <div id="job-field-graph"></div>
    </div>

    <!-- JavaScript to render the charts -->
    <script>
        // Embed server-side data into JavaScript
        const disabilityGraph = JSON.parse('{{ disability_graph | tojson | safe }}');
        const jobFieldGraph = JSON.parse('{{ job_field_graph | tojson | safe }}');

        // Render Disability Distribution Graph
        Plotly.newPlot('disability-graph', disabilityGraph.data, disabilityGraph.layout);

        // Render Job Field Interest Distribution Graph
        Plotly.newPlot('job-field-graph', jobFieldGraph.data, jobFieldGraph.layout);
    </script>
</body>
</html>
