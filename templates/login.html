<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DisabledIn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fa;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            padding: 30px;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #0077b5;
        }

        .form-label {
            font-weight: bold;
        }

        .btn-primary {
            background-color: #0077b5;
            border: none;
        }

        .btn-primary:hover {
            background-color: #005a89;
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Login to DisabledIn</h2>
            <!-- Update the form with the next parameter -->
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <!-- Add hidden field for next parameter -->
                <input type="hidden" name="next" value="{{ request.args.get('next') }}">
                <p class="register-link">
                    <a href="/register" class="text-decoration-none">Don't have an account? Register here</a>
                </p>
            </form>
        </div>
    </div>
    <section class="text-speech-section py-5">
        <div class="container">
            <h2 class="text-center mb-4">Assistive Features</h2>
            <div class="row">
                <!-- Text-to-Speech Feature -->
                <div class="col-md-6 text-center">
                    <h4>Text-to-Speech</h4>
                    <input type="text" id="ttsInput" class="form-control mb-3" placeholder="Enter text for TTS">
                    <button class="btn btn-primary" onclick="sendTTS()">Speak</button>
                </div>
                <!-- Speech-to-Text Feature -->
                <div class="col-md-6 text-center">
                    <h4>Speech-to-Text</h4>
                    <button class="btn btn-success mb-3" onclick="startSTT()">Start Listening</button>
                    <p>Transcribed Text: <span id="sttOutput" class="text-muted"></span></p>
                </div>
            </div>
        </div>
    </section>
    <script>
        const socket = io();
    
        // Automatically read out page content
        document.addEventListener("DOMContentLoaded", () => {
            const pageContent = document.body.innerText;
            socket.emit('speak', { text: pageContent });
        });
    
        // Handle navigation via STT
        socket.on('navigate', (data) => {
            if (data.error) {
                alert(data.error);
            } else {
                window.location.href = data.url;
            }
        });
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
</body>

</html>
